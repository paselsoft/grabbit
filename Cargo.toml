[package]
name = "grabbit"
version = "0.2.0"
edition = "2021"
rust-version = "1.87"
description = "Download video and music from YouTube and Spotify with yt-dlp, with a simple graphical interface"
license = "GPL-3.0-or-later"
# IMPORTANTE: metti qui l'URL del tuo repository GitHub. L'aggiornamento
# automatico dell'app legge le release da questo repository.
repository = "https://github.com/OWNER/grabbit"
build = "build.rs"

[dependencies]
# GUI leggera: renderer "glow" (OpenGL) al posto del più pesante wgpu
eframe = { version = "0.37", default-features = false, features = [
    "glow", "default_fonts", "clipboard", "wayland", "x11", "accesskit",
] }
rfd = "0.17"
# png per l'icona; jpeg e webp per le copertine nei risultati della ricerca
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# rete, dati, errori
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
directories = "6"
semver = "1"
self-replace = "1"
# estrazione di ffmpeg e Deno (zip) e di ffmpeg su Linux (tar.xz)
zip = { version = "9", default-features = false, features = ["deflate"] }
sys-locale = "0.3.2"
# player audio («Ascolta»): riproduzione con cpal (CoreAudio, WASAPI, ALSA) e decodifica
# in Rust puro con symphonia: MP3, M4A/AAC, FLAC, WAV, OGG Vorbis (Opus no)
rodio = { version = "0.23", default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis", "wav"] }
# lettura di titoli, artisti, numeri di traccia e copertine (la stessa versione usata da rodio)
symphonia = { version = "0.5", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
tar = "0.4"
xz2 = { version = "0.1", features = ["static"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
